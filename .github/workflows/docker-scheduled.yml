name: Update alpine actinia dependencies
on:
  schedule:
  # every 14th at 22UTC
    - cron: '00 22 14 * *'
  workflow_dispatch:

env:
    DOCKERHUB_REPOSITORY: mundialis/actinia

jobs:

  docker-alpine-dependencies:
    name: build and push dependency image
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: meta
        name: Create tag name
        run: |
          date=`date -I`
          tag=${DOCKERHUB_REPOSITORY}:alpine-dependencies-$date
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "tags=$tag" >> "$GITHUB_OUTPUT"
      - name: log
        run: echo ${{ steps.meta.outputs.tags }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN  }}
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          push: true
          pull: true
          context: .
          tags: ${{ steps.meta.outputs.tags }}
          file: actinia-alpine/Dockerfile_alpine_dependencies
      - name: Image digest
        run: echo "${{ steps.docker_build.outputs.digest }}"
      - name: Test compatibility with actinia-alpine
        uses: docker/build-push-action@v7
        with:
          push: false
          pull: true
          context: .
          file: actinia-alpine/Dockerfile
          target: compatibility-test
          build-args: |
            ALPINE_DEPENDENCIES_TAG=alpine-dependencies-${{ steps.meta.outputs.date }}
      - name: Update alpine dependencies tag
        id: update_tag
        run: |
          sed -i \
            "s/^ARG ALPINE_DEPENDENCIES_TAG=.*/ARG ALPINE_DEPENDENCIES_TAG=alpine-dependencies-${{ steps.meta.outputs.date }}/" \
            actinia-alpine/Dockerfile

          if git diff --quiet actinia-alpine/Dockerfile; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create pull request
        if: steps.update_tag.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            actinia-alpine/Dockerfile
          commit-message: "Update alpine dependencies image tag"
          title: "Update alpine dependencies image tag to alpine-dependencies-${{ steps.meta.outputs.date }}"
          body: |
            Updates the `alpine-dependencies` image tag to
            `alpine-dependencies-${{ steps.meta.outputs.date }}`.
            
            The new dependency image passed the compatibility test with
            `osgeo/grass-gis:main-alpine`.
          branch: "update-alpine-dependencies-${{ steps.meta.outputs.date }}"
          base: main

