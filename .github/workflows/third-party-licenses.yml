name: Generate Third-Party Licenses

on:
  release:
    types: [published]

jobs:
  generate-third-party-licenses-alpine:
    permissions:
      contents: write
    uses: mundialis/github-workflows/.github/workflows/third-party-licenses.yml@main
    with:
      dockerfile: actinia-alpine/Dockerfile
      # requirements: requirements.txt
      # pyproject: pyproject.toml
      additional-packages: "libgdal-dev gdal-bin build-essential"
  generate-third-party-licenses-alpine-dependencies:
    permissions:
      contents: write
    uses: mundialis/github-workflows/.github/workflows/third-party-licenses.yml@main
    with:
      dockerfile: actinia-alpine/Dockerfile_alpine_dependencies
      # requirements: requirements.txt
      # pyproject: pyproject.toml
      additional-packages: "libgdal-dev gdal-bin build-essential"
